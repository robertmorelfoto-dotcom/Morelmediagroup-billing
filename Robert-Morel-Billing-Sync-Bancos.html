const SupabaseClientRepo=()=>{

      if(error){

        return;

      cache=data||[];

};

      const {data,error}=await supabaseClient
        .from('payments')
        .select('*')
        .order('created_at',{ascending:false});

      if(error){
        console.error('Error cargando pagos:',error);
        return;
      }

      cache=(data||[]).map(p=>({
        ...p,
        invoiceId:p.invoice_id,
        user:p.user_name
      }));
    },

    async save(r){
      const {data:{user}}=await supabaseClient.auth.getUser();

      if(!user){
        console.error('No hay usuario autenticado');
        return null;
      }

      const payment={
        ...(r.id?{id:r.id}:{}),
        user_id:user.id,
        invoice_id:r.invoiceId||r.invoice_id||null,
        date:r.date||null,
        amount:+r.amount||0,
        method:r.method||null,
        ref:r.ref||null,
        note:r.note||null,
        user_name:r.user||r.user_name||null
      };

      const {data,error}=await supabaseClient
        .from('payments')
        .upsert(payment)
        .select()
        .single();

      if(error){
        console.error('Error guardando pago:',error);
        toast('Error guardando pago');
        return null;
      }

      const normalized={
        ...data,
        invoiceId:data.invoice_id,
        user:data.user_name
      };

      const i=cache.findIndex(x=>x.id===normalized.id);

      if(i<0){
        cache.unshift(normalized);
      }else{
        cache[i]=normalized;
      }

      return normalized;
    },

    async del(id){
      const {error}=await supabaseClient
        .from('payments')
        .delete()
        .eq('id',id);

      if(error){
        console.error('Error eliminando pago:',error);
        return;
      }

      cache=cache.filter(r=>r.id!==id);
    }
  };
};

async function dlPdf(id){const i=R.inv.get(id),b=R.brand.get(i.brand);if(!window.html2canvas||!window.jspdf)return toast('No cargó la librería PDF. Usa Imprimir → Guardar como PDF');toast('Generando PDF…');
try{const el=$('#inv'),c=await html2canvas(el,{scale:2,backgroundColor:'#ffffff',logging:false}),d=new jspdf.jsPDF({unit:'mm',format:b.paper==='Letter'?'letter':'a4'}),pw=d.internal.pageSize.getWidth(),ph=d.internal.pageSize.getHeight();
/* Hojas con margen: si la factura pasa de una hoja, se corta ENTRE líneas (nunca por la mitad de un texto) y cada hoja deja margen arriba y abajo */
const W=el.offsetWidth,H=el.offsetHeight,mm=pw/W,k=c.width/W,M=14,t0=el.getBoundingClientRect().top,bg=(getComputedStyle(el).backgroundColor.match(/\d+/g)||[255,255,255]).slice(0,3).map(Number);
if(H*mm<=ph+.5){d.addImage(c.toDataURL('image/jpeg',.95),'JPEG',0,0,pw,H*mm)}
else{const rc=[],wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;while(n=wk.nextNode()){if(!n.nodeValue.trim())continue;const r=document.createRange();r.selectNodeContents(n);for(const q of r.getClientRects())if(q.height>0)rc.push([q.top-t0-1,q.bottom-t0+1])}
el.querySelectorAll('tr').forEach(t=>{const q=t.getBoundingClientRect();if(q.height*mm<ph-2*M)rc.push([q.top-t0,q.bottom-t0])});
let y=0,fp=true;while(y<H-1){const room=(fp?ph-M:ph-2*M)/mm;let cut=y+room;
if(cut>=H-.5)cut=H;else{let mv=true,g=0;while(mv&&g++<60){mv=false;for(const r of rc){if(r[0]>y+8&&r[0]<cut&&r[1]>cut){cut=r[0];mv=true}}}if(cut<=y+8)cut=y+room}
const sh=Math.max(1,Math.round((cut-y)*k)),s2=document.createElement('canvas');s2.width=c.width;s2.height=sh;s2.getContext('2d').drawImage(c,0,Math.round(y*k),c.width,sh,0,0,c.width,sh);
if(!fp)d.addPage();d.setFillColor(bg[0],bg[1],bg[2]);d.rect(0,0,pw,ph,'F');d.addImage(s2.toDataURL('image/jpeg',.95),'JPEG',0,fp?0:M,pw,(cut-y)*mm);y=cut;fp=false}}
const blob=d.output('blob'),dl=window.claude?await claude.use('downloads'):null,fn=invName(i)+'.pdf';if(dl){await dl.save({filename:fn,data:blob});toast('PDF listo')}else{d.save(fn)}}catch(e){toast(e&&e.code==='declined'?'Descarga cancelada':'No se pudo generar el PDF. Usa Imprimir → Guardar como PDF');console.error(e)}}

/* País de un cliente: columna "country" si existe en Supabase; si no, un registro local por cliente. Sin dato = República Dominicana */
const cliCountry=c=>(c&&(c.country||(Store.get('clientCountry')||{})[c.id]))||DEFAULT_COUNTRY;
async function setCliCountry(id,ct){
  const m=Store.get('clientCountry')||{};
  try{
    const {error}=await supabaseClient.from('clients').update({country:ct}).eq('id',id);
    if(!error){const c=R.cli.get(id);if(c)c.country=ct;if(m[id]!==undefined){delete m[id];Store.set('clientCountry',m)}return}
    console.warn('Países: la columna "country" no existe en clients; el país se guarda en este navegador. Ejecuta paises-supabase.sql para sincronizarlo.',error.message);
  }catch(e){console.warn('Países:',e)}
  m[id]=ct;Store.set('clientCountry',m);
}
(()=>{const o=R.cli.save.bind(R.cli);R.cli.save=async function(r){const ct=r&&r.country,v=await o(r);if(v&&ct)await setCliCountry(v.id,ct);return v}})();

<script>
/* ===== BANCOS (módulo nuevo): cuentas, etiquetas de bancos, terminales y vínculo con pagos/egresos ===== */
const BANK_SQL=`create table if not exists public.bank_data (
  id uuid primary key default gen_random_uuid(),
  user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,
  kind text not null,
  data jsonb not null default '{}'::jsonb,
  created_at timestamptz not null default now()
);
alter table public.bank_data enable row level security;
drop policy if exists "bank_data_select" on public.bank_data;
drop policy if exists "bank_data_insert" on public.bank_data;
drop policy if exists "bank_data_update" on public.bank_data;
drop policy if exists "bank_data_delete" on public.bank_data;
create policy "bank_data_select" on public.bank_data for select using (auth.uid() = user_id);
create policy "bank_data_insert" on public.bank_data for insert with check (auth.uid() = user_id);
create policy "bank_data_update" on public.bank_data for update using (auth.uid() = user_id) with check (auth.uid() = user_id);
create policy "bank_data_delete" on public.bank_data for delete using (auth.uid() = user_id);
do $$ begin
  if exists (select 1 from pg_publication where pubname='supabase_realtime')
     and not exists (select 1 from pg_publication_tables where pubname='supabase_realtime' and schemaname='public' and tablename='bank_data') then
    alter publication supabase_realtime add table public.bank_data;
  end if;
end $$;`;
const Bank=(()=>{
  const LK='bank_data';
  const uuid=()=>(typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)});
  let rows=[],mode='local',lmap=new Map();
  const reindex=()=>{lmap=new Map();rows.filter(r=>r.kind==='link').forEach(r=>lmap.set(r.data.k,r))};
  const parse=v=>{if(!v)return null;const p=String(v).split('|');return{a:p[0],t:p.slice(1).join('|')}};
  const B={
    cur:null,
    mode:()=>mode,
    async refresh(){
      const local=Store.get(LK)||[];
      try{
        const {data,error}=await supabaseClient.from(LK).select('*').order('created_at',{ascending:true});
        if(error)throw error;
        mode='remote';rows=data||[];
        if(local.length){
          const {data:{user}}=await supabaseClient.auth.getUser();
          const up=local.filter(l=>!rows.some(r=>r.id===l.id)).map(l=>({id:l.id,user_id:user.id,kind:l.kind,data:l.data}));
          if(up.length){
            const {error:e2}=await supabaseClient.from(LK).upsert(up);
            if(e2)throw e2;
            rows=rows.concat(up);
          }
          Store.set(LK,[]);
        }
      }catch(err){
        mode='local';rows=local;
        console.warn('Bancos: la tabla bank_data no está disponible; se usa el almacenamiento de este navegador.',err);
      }
      reindex();
    },
    list:k=>rows.filter(r=>r.kind===k).map(r=>({id:r.id,...r.data})),
    labels(){return this.list('label').sort((a,b)=>a.name.localeCompare(b.name))},
    accounts(){return this.list('account').sort((a,b)=>(b.main?1:0)-(a.main?1:0)||a.name.localeCompare(b.name))},
    lab(id){return this.labels().find(l=>l.id===id)},
    acc(id){return this.accounts().find(a=>a.id===id)},
    accName(a){const l=this.lab(a.bank);return (l?l.name:'Banco')+' · '+a.name+(a.last4?' ····'+a.last4:'')},
    async put(kind,data,id){
      id=id||uuid();
      if(mode==='remote'){
        const {data:{user}}=await supabaseClient.auth.getUser();
        if(!user){toast('Sesión no válida');return null}
        const {error}=await supabaseClient.from(LK).upsert({id,user_id:user.id,kind,data});
        if(error){console.error('Error guardando en Bancos:',error);toast('Error guardando en Bancos');return null}
      }
      const row={id,kind,data},i=rows.findIndex(r=>r.id===id);
      if(i<0)rows.push(row);else rows[i]=row;
      if(mode==='local')Store.set(LK,rows);
      reindex();
      return row;
    },
    async remove(id){
      if(mode==='remote'){
        const {error}=await supabaseClient.from(LK).delete().eq('id',id);
        if(error){console.error('Error eliminando en Bancos:',error);toast('Error eliminando en Bancos');return false}
      }
      rows=rows.filter(r=>r.id!==id);
      if(mode==='local')Store.set(LK,rows);
      reindex();
      return true;
    },
    linkOf(t,id){const r=lmap.get(t+':'+id);return r?{a:r.data.a,t:r.data.t||''}:null},
    async setLink(t,id,val){
      const key=t+':'+id,ex=lmap.get(key),p=parse(val);
      if(!p||!p.a){if(ex)await this.remove(ex.id);return}
      if(ex&&ex.data.a===p.a&&(ex.data.t||'')===p.t)return;
      await this.put('link',{k:key,a:p.a,t:p.t},ex&&ex.id);
    },
    opts(sel,terms){
      let h='<option value="">Sin cuenta (efectivo / otro)</option>';
      this.accounts().filter(a=>a.active!==false||('|'+(sel||'')).includes(a.id)).forEach(a=>{
        const v=a.id+'|';h+=`<option value="${esc(v)}" ${sel===v?'selected':''}>${esc(this.accName(a))}${a.main?' ★':''}</option>`;
        if(terms)(a.terms||[]).forEach(t=>{const w=a.id+'|'+t,l=this.lab(a.bank);h+=`<option value="${esc(w)}" ${sel===w?'selected':''}>${esc((l?l.name:'Banco')+' · '+t+' ('+a.name+')')}</option>`});
      });
      return h;
    },
    mainVal(){const m=this.accounts().find(a=>a.main&&a.active!==false);return m?m.id+'|':''},
    selVal(lk){return lk?lk.a+'|'+(lk.t||''):''},
    block(sel,terms,label,attr){return `<div class="w" data-bkinj="1"><label>${label}</label><select ${attr}>${this.opts(sel,terms)}</select>${this.accounts().length?'':'<div class="mu" style="font-size:12px;margin-top:3px">Aún no hay cuentas: créalas en la sección Bancos.</div>'}</div>`},
    /* Inserta el selector de cuenta en los formularios existentes (pago, egreso y abono de la factura) sin tocar sus plantillas */
    patch(h){
      if(typeof h!=='string'||h.indexOf('data-bkinj')>=0)return h;
      try{
        if(h.indexOf('data-form="pay"')>=0){
          return h.replace('</div><div class="ft">',this.block(this.mainVal(),true,'Cuenta donde se recibió el pago','name="bank"')+'</div><div class="ft">');
        }
        if(h.indexOf('data-form="exp"')>=0){
          const m=h.match(/data-form="exp" data-id="([^"]*)"/),id=m&&m[1],lk=id?this.linkOf('exp',id):null;
          return h.replace('</div><div class="ft">',this.block(id?this.selVal(lk):this.mainVal(),false,'Cuenta de la que salió el pago','name="bank"')+'</div><div class="ft">');
        }
        const k='Se registra como primer pago de esta factura.</p>';
        if(h.indexOf('data-ab')>=0&&h.indexOf(k)>=0){
          if(H.bank===undefined)H.bank=this.mainVal();
          return h.replace(k,k+this.block(H.bank,true,'Cuenta donde se recibe el abono','data-h="bank"'));
        }
      }catch(e){console.warn('Bancos: no se pudo insertar el selector',e)}
      return h;
    }
  };
  return B;
})();
/* Los formularios usan $('#md').innerHTML=...; interceptamos esa asignación para añadir el selector de cuenta */
(()=>{
  const md=document.getElementById('md');if(!md)return;
  const d0=(typeof Element!=='undefined')&&Object.getOwnPropertyDescriptor(Element.prototype,'innerHTML');
  if(d0&&d0.set)Object.defineProperty(md,'innerHTML',{configurable:true,get(){return d0.get.call(this)},set(v){d0.set.call(this,Bank.patch(v))}});
})();
/* Vincular cuenta a pagos y egresos al guardarlos */
(()=>{
  const wrap=(repo,kind)=>{
    const orig=repo.save.bind(repo);
    repo.save=async function(r){
      let bk;
      if(r&&r.bank!==undefined)bk=r.bank;
      else if(kind==='pay'){
        if(r&&r.note==='Abono inicial')bk=(typeof H!=='undefined'&&H.bank!==undefined)?H.bank:undefined;
        else if(Bank.cur&&Date.now()-Bank.cur.t<3000&&Bank.cur.v!==undefined){bk=Bank.cur.v;Bank.cur=null}
      }
      const v=await orig(r);
      if(v&&bk!==undefined){await Bank.setLink(kind,v.id,bk);try{render()}catch(e){}}
      return v;
    };
  };
  wrap(R.pay,'pay');wrap(R.exp,'exp');
})();
/* Sincronización de interfaz: después de cada escritura remota, actualizar la vista sin exigir recargar. */
(()=>{
  const repos=[R.brand,R.cli,R.inv,R.pay,R.exp,R.prod,R.tag];
  repos.forEach(repo=>{
    for(const method of ['save','del']){
      if(typeof repo[method]!=='function')continue;
      const original=repo[method].bind(repo);
      repo[method]=async function(...args){
        const result=await original(...args);
        if(result!==null && result!==false){
          try{render()}catch(e){}
        }
        return result;
      };
    }
  });
})();
/* ===== Página Bancos ===== */
const bkMoves=()=>{
  const M=invMap(),o=[];
  R.pay.all().forEach(p=>{const i=M[p.invoiceId];if(!i)return;o.push({t:'in',k:'pay',id:p.id,date:p.date||'',amt:cv(i,+p.amount||0),show:fmt(p.amount,i.cur),party:cn(i.client),concept:'Abono · '+i.number,brand:i.brand,lk:Bank.linkOf('pay',p.id)})});
  R.exp.all().forEach(e=>o.push({t:'out',k:'exp',id:e.id,date:e.date||'',amt:+e.amount||0,show:fmt(e.amount),party:e.vendor||'—',concept:e.concept||e.description||'Egreso',brand:e.brand,lk:Bank.linkOf('exp',e.id)}));
  return o;
};
function bank(){
  S.bper=S.bper||'year';S.bfrom=S.bfrom||today;S.bto=S.bto||today;S.bsel=S.bsel||'';S.bq=S.bq||'';
  const[f,t]=range(S.bper,S.bfrom,S.bto),accs=Bank.accounts(),labs=Bank.labels(),all=bkMoves();
  const has=m=>m.lk&&Bank.acc(m.lk.a),inScope=all.filter(m=>sc({brand:m.brand})),per=inScope.filter(m=>m.date>=f&&m.date<=t);
  const stat=a=>{const mm=per.filter(m=>m.lk&&m.lk.a===a.id);return{i:sum(mm.filter(m=>m.t==='in').map(m=>m.amt)),o:sum(mm.filter(m=>m.t==='out').map(m=>m.amt))}};
  const bal=a=>(+a.open||0)+sum(all.filter(m=>m.lk&&m.lk.a===a.id).map(m=>m.t==='in'?m.amt:-m.amt));
  const act=accs.filter(a=>a.active!==false),main=act.find(a=>a.main),pw=per.filter(has);
  const totIn=sum(pw.filter(m=>m.t==='in').map(m=>m.amt)),totOut=sum(pw.filter(m=>m.t==='out').map(m=>m.amt)),orphan=per.filter(m=>!has(m));
  const K=(k,v,s)=>`<div class="card"><div class="k">${k}</div><div class="v sm">${v}</div>${s?`<div class="k">${s}</div>`:''}</div>`;
  const PER=[['month','Este mes'],['3m','Últimos 3 meses'],['6m','Últimos 6 meses'],['year','Este año'],['last','Año anterior'],['custom','Rango personalizado']];
  let h=`<div class="top"><span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><select id="bper" style="width:auto">${PER.map(o=>`<option value="${o[0]}" ${S.bper===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>${S.bper==='custom'?`<input type="date" id="bpf" value="${S.bfrom}" style="width:auto"><input type="date" id="bpt" value="${S.bto}" style="width:auto">`:''}</span><span><button class="btn" data-act="blabs">Etiquetas de bancos</button> <button class="btn p" data-act="bacc">+ Nueva cuenta</button></span></div>`;
  if(Bank.mode()==='local')h+=`<div class="card" style="margin-bottom:14px"><b>Bancos se está guardando solo en este navegador</b><p class="mu" style="margin:4px 0 10px">Para guardar y sincronizar tus cuentas en Supabase, ejecuta una vez el SQL en el editor SQL de tu proyecto. Tus datos actuales se suben solos cuando exista la tabla.</p><button class="btn s" data-act="bsql">Copiar SQL</button></div>`;
  if(!accs.length){
    return h+`<div class="card"><b>Registra tu primera cuenta</b><p class="mu">Crea la cuenta empresarial principal y las demás. Luego, al registrar pagos y egresos, eliges en qué cuenta o terminal entró o salió el dinero.</p><div class="ft" style="justify-content:flex-start"><button class="btn" data-act="bcommon">Agregar bancos comunes</button><button class="btn p" data-act="bacc">+ Nueva cuenta</button></div></div>`;
  }
  h+=`<div class="grid">${K('Saldo estimado total',fmt(sum(act.map(bal))),'apertura + cobros − gastos')}${K('Ingresos del periodo',fmt(totIn))}${K('Egresos del periodo',fmt(totOut))}${K('Neto del periodo',fmt(totIn-totOut))}</div>`;
  if(main){const l=Bank.lab(main.bank),st=stat(main);h+=`<div class="bk-hero" style="--bc:${l?l.color:'#1f6f6b'}"><div><div class="bk-tag">Cuenta principal</div><div class="bk-name">${esc(l?l.name:'Banco')} · ${esc(main.name)}${main.last4?' ····'+esc(main.last4):''}</div><div class="bk-sub">${esc(main.kind||'')}${(main.terms||[]).length?' · Terminales: '+esc(main.terms.join(', ')):''}</div></div><div style="text-align:right"><div class="bk-bal">${fmt(bal(main))}</div><div class="bk-sub">+${fmt(st.i)} · −${fmt(st.o)} en el periodo</div><button class="btn s" data-act="bsel" data-id="a:${main.id}" style="margin-top:8px">Ver movimientos</button> <button class="btn s" data-act="bacc" data-id="${main.id}" style="margin-top:8px">Editar</button></div></div>`}
  else h+=`<div class="card" style="margin-bottom:14px"><span class="mu">Marca una cuenta como principal (cuenta empresarial) para destacarla aquí.</span></div>`;
  const groups=labs.map(l=>({l,a:accs.filter(a=>a.bank===l.id)})).filter(g=>g.a.length),lost=accs.filter(a=>!Bank.lab(a.bank));
  if(lost.length)groups.push({l:{id:'x',name:'Otros bancos',color:'#8e98a3'},a:lost});
  h+=`<div class="bk-grid">${groups.map(g=>{const ss=g.a.map(stat),tb=sum(g.a.map(bal));return`<div class="bk-sq ${S.bsel==='l:'+g.l.id?'on':''}" style="--bc:${g.l.color}" data-act="bsel" data-id="l:${g.l.id}"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(g.l.name)}</b><span class="mu">${g.a.length} cuenta(s)</span></div><div class="v sm">${fmt(tb)}</div><div class="k">+${fmt(sum(ss.map(x=>x.i)))} · −${fmt(sum(ss.map(x=>x.o)))} en el periodo</div>${g.a.map(a=>`<div class="bk-acc ${S.bsel==='a:'+a.id?'on':''}" data-act="bsel" data-id="a:${a.id}"><div style="display:flex;justify-content:space-between;gap:8px"><span><b>${esc(a.name)}</b>${a.main?' ★':''} <span class="mu">${a.last4?'····'+esc(a.last4):''}</span>${a.active===false?' <span class="mu">(inactiva)</span>':''}</span><button class="btn s" data-act="bacc" data-id="${a.id}">Editar</button></div><div class="k">${fmt(bal(a))}${(a.terms||[]).length?' · '+esc(a.terms.join(', ')):''}</div></div>`).join('')}</div>`}).join('')}${orphan.length?`<div class="bk-sq ${S.bsel==='none'?'on':''}" style="--bc:#8e98a3" data-act="bsel" data-id="none"><b>Sin cuenta asignada</b><div class="v sm">${orphan.length}</div><div class="k">movimiento(s) del periodo sin banco</div></div>`:''}</div>`;
  let mv=per.slice();const q=S.bq;
  if(S.bsel==='none')mv=mv.filter(m=>!has(m));else if(S.bsel.startsWith('a:'))mv=mv.filter(m=>has(m)&&m.lk.a===S.bsel.slice(2));else if(S.bsel.startsWith('l:'))mv=mv.filter(m=>has(m)&&Bank.acc(m.lk.a).bank===S.bsel.slice(2));
  const nm=m=>{if(!has(m))return'';const a=Bank.acc(m.lk.a),l=Bank.lab(a.bank);return(l?l.name:'Banco')+' '+a.name+' '+m.lk.t};
  if(q)mv=mv.filter(m=>(nm(m)+' '+m.party+' '+m.concept+' '+m.date).toLowerCase().includes(q));
  mv.sort((a,b)=>b.date.localeCompare(a.date));
  const fl=S.bsel?(S.bsel==='none'?'Sin cuenta asignada':S.bsel[0]==='a'?(Bank.acc(S.bsel.slice(2))?Bank.accName(Bank.acc(S.bsel.slice(2))):'Cuenta'):(groups.find(g=>'l:'+g.l.id===S.bsel)||{l:{name:'Banco'}}).l.name):'';
  if(fl)h+=`<div class="top"><span class="mu">Mostrando solo: <b>${esc(fl)}</b></span><button class="btn s" data-act="bsel" data-id="">Quitar filtro</button></div>`;
  h+=`<div class="card"><b>Movimientos</b>${tbl(['Banco · terminal','Cliente / proveedor','Concepto','Fecha','>Monto',''],mv.slice(0,300).map(m=>{const a=has(m)?Bank.acc(m.lk.a):null,l=a?Bank.lab(a.bank):null;return`<tr class="bkr"><td>${a?`<b>${esc(l?l.name:'Banco')}${m.lk.t?' · '+esc(m.lk.t):''}</b><div class="mu">${esc(a.name)}${a.last4?' ····'+esc(a.last4):''}</div>`:'<span class="mu">Sin cuenta asignada</span>'}</td><td>${esc(m.party)}</td><td>${esc(m.concept)}</td><td>${fd(m.date)}</td><td class="r"><b style="color:var(${m.t==='in'?'--ok':'--er'})">${m.t==='in'?'+':'−'}${m.show}</b></td><td class="act"><button class="btn s" data-act="blink" data-k="${m.k}" data-id="${m.id}">Cuenta</button></td></tr>`}),'No hay movimientos en este periodo.')}</div>`;

}
